project:
  device: :M55_HP
  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
  groups:
    - group: SDF renderer
      files:
        - file: ./sdf_renderer.cpp
        - file: ./sdf_renderer.h
        - file: ./model_runtime.cpp
        - file: ./model_runtime.h
  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI
  output:
    type: [elf, bin, hex, map]
