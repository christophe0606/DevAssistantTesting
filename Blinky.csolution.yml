# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.14.1
  cdefault: # use CMSIS-Toolbox default Compiler options

  # Compilers that can be selected.
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: CLANG

  # List the packs that define the device and/or board.
  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: PyTorch::ExecuTorch@1.4.1
    - pack: ARM::CMSIS-NN
    - pack: ARM::ethos-u-core-driver@1.26.5

  # List different hardware targets that are used to deploy the solution.
  target-types:

    - type: DevKit-E8
      board: DevKit-E8
      device: AE822FA0E5597LS0
      variables:
        - Board-Layer: $SolutionDir()$/board/DevKit-E8/Board.clayer.yml
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
      target-set:
        - set:
          images:
            - project-context: M55_HP.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Release
          images:
            - project-context: M55_HP.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd

  # List of different build configurations.
  build-types:
    - type: Debug
      debug: on
      optimize: none

    - type: Release
      debug: on
      optimize: speed
      misc:
        - C:
            - -O3
            - -ffast-math
          CPP:
            - -O3
            - -ffast-math

  # List related projects.
  projects:
    - project: M55_HP/M55_HP.cproject.yml
  compiler: AC6

  mlops:
    description: Recurrent image-wide signed-distance renderer
    npu:
      type: Ethos-U85
      macs: 256
    vela:
      system: Ethos_U85_SRAM_MRAM
      memory: Shared_Sram
    model:
      clayer: $AI-Layer$
      name: SdfRenderer
